<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Modular Maze Engine</title>
  <desc id="description">A coastal maze engine built around a Java plugin API, JavaCC map language, Jython scripts, and Swing interface.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3733"/>
      <stop offset="1" stop-color="#145c54"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d4"/>
      <stop offset="1" stop-color="#efd49c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071e1c" flood-opacity=".32"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#85cfc2" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="30" fill="url(#background)"/>
  <rect width="1280" height="640" rx="30" fill="url(#grid)"/>
  <circle cx="116" cy="72" r="86" fill="#ed705b" opacity=".10"/>
  <circle cx="1210" cy="592" r="150" fill="#aee466" opacity=".08"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="74" y="96" fill="#aee466" font-size="15" font-weight="700" letter-spacing="3">EXTENSIBLE DESKTOP ENGINE</text>
    <text x="74" y="164" fill="#ffffff" font-size="54" font-weight="800">Modular Maze</text>
    <text x="74" y="222" fill="#ffffff" font-size="54" font-weight="800">Engine</text>
    <text x="74" y="276" fill="#cde2dc" font-size="21">Maps become executable worlds through a</text>
    <text x="74" y="308" fill="#cde2dc" font-size="21">typed extension boundary and embedded scripts.</text>

    <g font-size="14" font-weight="700">
      <g transform="translate(74 356)">
        <rect width="104" height="36" rx="18" fill="#214d48" stroke="#4f8d84"/>
        <text x="52" y="23" text-anchor="middle" fill="#ffffff">JAVA 17</text>
      </g>
      <g transform="translate(188 356)">
        <rect width="126" height="36" rx="18" fill="#214d48" stroke="#4f8d84"/>
        <text x="63" y="23" text-anchor="middle" fill="#ffffff">JAVACC DSL</text>
      </g>
      <g transform="translate(324 356)">
        <rect width="102" height="36" rx="18" fill="#214d48" stroke="#4f8d84"/>
        <text x="51" y="23" text-anchor="middle" fill="#ffffff">JYTHON</text>
      </g>
      <g transform="translate(436 356)">
        <rect width="86" height="36" rx="18" fill="#214d48" stroke="#4f8d84"/>
        <text x="43" y="23" text-anchor="middle" fill="#ffffff">SWING</text>
      </g>
    </g>

    <g transform="translate(74 444)">
      <rect width="468" height="112" rx="20" fill="#0b2a27" stroke="#3b736b"/>
      <text x="24" y="32" fill="#88d2c5" font-size="13" font-weight="700" letter-spacing="1.5">RUNTIME EXTENSIONS</text>
      <g transform="translate(24 49)" font-size="15" font-weight="700">
        <circle cx="9" cy="15" r="9" fill="#ee6f5a"/>
        <text x="28" y="21" fill="#ffffff">Teleport</text>
        <circle cx="139" cy="15" r="9" fill="#f5cd68"/>
        <text x="158" y="21" fill="#ffffff">Penalty</text>
        <circle cx="267" cy="15" r="9" fill="#aee466"/>
        <text x="286" y="21" fill="#ffffff">Reveal</text>
      </g>
      <text x="24" y="94" fill="#aacbc5" font-size="14">Discovered from the map • compiled independently</text>
    </g>

    <g transform="translate(668 58)" filter="url(#shadow)">
      <rect width="538" height="524" rx="28" fill="#f8fbf7"/>
      <g transform="translate(32 28)">
        <circle cx="8" cy="8" r="5" fill="#ee6f5a"/>
        <circle cx="26" cy="8" r="5" fill="#f5cd68"/>
        <circle cx="44" cy="8" r="5" fill="#8fd36b"/>
        <text x="474" y="13" text-anchor="end" fill="#58756f" font-size="13" font-weight="700">coastal-treasure.utf8.map</text>
      </g>

      <g transform="translate(48 74)">
        <rect width="442" height="378" rx="18" fill="url(#sand)" stroke="#c4aa73" stroke-width="2"/>
        <g stroke="#b89b63" stroke-opacity=".62" stroke-width="1">
          <path d="M63 0V378M126 0V378M189 0V378M252 0V378M315 0V378M378 0V378"/>
          <path d="M0 54H442M0 108H442M0 162H442M0 216H442M0 270H442M0 324H442"/>
        </g>

        <g fill="#284c47" opacity=".72">
          <rect x="64" y="55" width="61" height="52" rx="8"/>
          <rect x="253" y="109" width="61" height="52" rx="8"/>
          <rect x="316" y="217" width="61" height="52" rx="8"/>
          <rect x="127" y="271" width="61" height="52" rx="8"/>
        </g>

        <g fill="#ffffff" opacity=".50">
          <rect x="0" y="0" width="63" height="54"/>
          <rect x="379" y="0" width="63" height="54"/>
          <rect x="0" y="324" width="63" height="54"/>
          <rect x="379" y="324" width="63" height="54"/>
        </g>

        <g transform="translate(146 78)">
          <circle cx="12" cy="12" r="17" fill="#ee6f5a" stroke="#8d2e27" stroke-width="3"/>
          <circle cx="4" cy="5" r="3" fill="#ffffff"/>
          <circle cx="20" cy="5" r="3" fill="#ffffff"/>
        </g>

        <g transform="translate(393 333)">
          <path d="M0 18L18 0L36 18L18 36Z" fill="#aee466" stroke="#3d6e3e" stroke-width="3"/>
          <circle cx="18" cy="18" r="5" fill="#ffffff"/>
        </g>

        <g transform="translate(204 181)">
          <path d="M0 8C0 3 4 0 9 0H34C39 0 43 3 43 8V31C43 36 39 39 34 39H9C4 39 0 36 0 31Z" fill="#ffffff" stroke="#d7a62c" stroke-width="3"/>
          <path d="M8 8L21 17L35 8" fill="none" stroke="#d7a62c" stroke-width="3"/>
          <text x="21" y="31" text-anchor="middle" fill="#8b6616" font-size="12" font-weight="800">MAP</text>
        </g>
      </g>

      <g transform="translate(48 468)">
        <text x="0" y="17" fill="#1d423e" font-size="15" font-weight="800">PLAYER</text>
        <circle cx="80" cy="12" r="7" fill="#ee6f5a"/>
        <text x="106" y="17" fill="#1d423e" font-size="15" font-weight="800">GOAL</text>
        <path d="M161 5L168 12L161 19L154 12Z" fill="#aee466"/>
        <text x="200" y="17" fill="#1d423e" font-size="15" font-weight="800">FOG-AWARE EXPLORATION</text>
      </g>
    </g>
  </g>
</svg>
