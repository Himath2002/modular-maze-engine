<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Modular Maze Engine architecture</title>
  <desc id="description">Map and Jython inputs flow into the core engine. The engine presents state to Swing, writes session snapshots, and communicates with three independently compiled plugins through the game API.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#177f74"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e86854"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#29443f" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1440" height="760" rx="30" fill="#f3f8f5"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="70" fill="#153f3a" font-size="34" font-weight="800">Architecture with an explicit extension boundary</text>
    <text x="64" y="104" fill="#60766f" font-size="17">Configuration, presentation, scripting, persistence, and runtime plugins remain independently understandable.</text>

    <g transform="translate(64 170)" filter="url(#shadow)">
      <rect width="246" height="136" rx="20" fill="#ffffff" stroke="#c6d9d1"/>
      <text x="24" y="32" fill="#177f74" font-size="13" font-weight="800" letter-spacing="1.3">CONFIGURATION</text>
      <text x="24" y="65" fill="#183c37" font-size="22" font-weight="800">Map DSL</text>
      <text x="24" y="91" fill="#61766f" font-size="14">size • entities • plugins</text>
      <text x="24" y="113" fill="#61766f" font-size="14">embedded script blocks</text>
    </g>

    <g transform="translate(380 170)" filter="url(#shadow)">
      <rect width="220" height="136" rx="20" fill="#d9f2e9" stroke="#9fcfc1"/>
      <text x="24" y="32" fill="#177f74" font-size="13" font-weight="800" letter-spacing="1.3">GENERATED ADAPTER</text>
      <text x="24" y="65" fill="#183c37" font-size="22" font-weight="800">JavaCC parser</text>
      <text x="24" y="91" fill="#486a62" font-size="14">syntax + bounds validation</text>
      <text x="24" y="113" fill="#486a62" font-size="14">typed map model</text>
    </g>

    <path d="M310 238H362" fill="none" stroke="#177f74" stroke-width="3" marker-end="url(#arrow-teal)"/>

    <g transform="translate(680 156)" filter="url(#shadow)">
      <rect width="300" height="214" rx="24" fill="#143f3a"/>
      <text x="28" y="37" fill="#aee466" font-size="13" font-weight="800" letter-spacing="1.4">APPLICATION CORE</text>
      <text x="28" y="75" fill="#ffffff" font-size="26" font-weight="800">MazeGame</text>
      <g transform="translate(28 98)">
        <rect width="112" height="38" rx="10" fill="#245b54"/>
        <text x="56" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">state + rules</text>
        <rect x="128" width="116" height="38" rx="10" fill="#245b54"/>
        <text x="186" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">event dispatch</text>
        <rect y="50" width="112" height="38" rx="10" fill="#245b54"/>
        <text x="56" y="74" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">visibility</text>
        <rect x="128" y="50" width="116" height="38" rx="10" fill="#245b54"/>
        <text x="186" y="74" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">plugin discovery</text>
      </g>
    </g>

    <path d="M600 238H662" fill="none" stroke="#177f74" stroke-width="3" marker-end="url(#arrow-teal)"/>

    <g transform="translate(680 436)" filter="url(#shadow)">
      <rect width="300" height="104" rx="20" fill="#ffffff" stroke="#c6d9d1"/>
      <text x="24" y="31" fill="#177f74" font-size="13" font-weight="800" letter-spacing="1.3">PRESENTATION</text>
      <text x="24" y="62" fill="#183c37" font-size="21" font-weight="800">Swing interface</text>
      <text x="24" y="84" fill="#61766f" font-size="14">renders state • sends commands</text>
    </g>

    <path d="M830 370V418" fill="none" stroke="#177f74" stroke-width="3" marker-end="url(#arrow-teal)"/>

    <g transform="translate(380 436)" filter="url(#shadow)">
      <rect width="220" height="104" rx="20" fill="#ffffff" stroke="#c6d9d1"/>
      <text x="24" y="31" fill="#177f74" font-size="13" font-weight="800" letter-spacing="1.3">EMBEDDED LOGIC</text>
      <text x="24" y="62" fill="#183c37" font-size="21" font-weight="800">Jython scripts</text>
      <text x="24" y="84" fill="#61766f" font-size="14">receives API lifecycle events</text>
    </g>

    <path d="M600 488H650V336H662" fill="none" stroke="#177f74" stroke-width="3" marker-end="url(#arrow-teal)"/>

    <g transform="translate(680 598)" filter="url(#shadow)">
      <rect width="300" height="98" rx="20" fill="#fff4dc" stroke="#ddc58e"/>
      <text x="24" y="30" fill="#9b6b13" font-size="13" font-weight="800" letter-spacing="1.3">PERSISTENCE</text>
      <text x="24" y="61" fill="#4c3c1d" font-size="21" font-weight="800">GameSnapshot</text>
      <text x="24" y="82" fill="#756444" font-size="14">complete resumable session state</text>
    </g>

    <path d="M830 540V580" fill="none" stroke="#177f74" stroke-width="3" marker-end="url(#arrow-teal)"/>

    <rect x="1028" y="140" width="348" height="586" rx="26" fill="#e4f4ee" stroke="#afd3c7"/>
    <text x="1060" y="178" fill="#177f74" font-size="13" font-weight="800" letter-spacing="1.3">INDEPENDENT GRADLE MODULES</text>
    <text x="1060" y="215" fill="#183c37" font-size="25" font-weight="800">Runtime plugins</text>

    <g transform="translate(1060 248)" filter="url(#shadow)">
      <rect width="284" height="112" rx="18" fill="#ffffff" stroke="#c6d9d1"/>
      <circle cx="30" cy="31" r="12" fill="#ee705b"/>
      <text x="54" y="38" fill="#183c37" font-size="20" font-weight="800">Teleport</text>
      <text x="24" y="70" fill="#61766f" font-size="14">interactive command capture</text>
      <text x="24" y="92" fill="#61766f" font-size="14">manual or automatic destination</text>
    </g>

    <g transform="translate(1060 384)" filter="url(#shadow)">
      <rect width="284" height="112" rx="18" fill="#ffffff" stroke="#c6d9d1"/>
      <circle cx="30" cy="31" r="12" fill="#f2c65b"/>
      <text x="54" y="38" fill="#183c37" font-size="20" font-weight="800">Penalty</text>
      <text x="24" y="70" fill="#61766f" font-size="14">movement observer + timer</text>
      <text x="24" y="92" fill="#61766f" font-size="14">injects a nearby obstacle</text>
    </g>

    <g transform="translate(1060 520)" filter="url(#shadow)">
      <rect width="284" height="112" rx="18" fill="#ffffff" stroke="#c6d9d1"/>
      <circle cx="30" cy="31" r="12" fill="#aee466"/>
      <text x="54" y="38" fill="#183c37" font-size="20" font-weight="800">Reveal</text>
      <text x="24" y="70" fill="#61766f" font-size="14">item acquisition observer</text>
      <text x="24" y="92" fill="#61766f" font-size="14">reveals goal + collectibles</text>
    </g>

    <path d="M980 263H1010" fill="none" stroke="#e86854" stroke-width="3"/>
    <path d="M1010 263V576" fill="none" stroke="#e86854" stroke-width="3"/>
    <path d="M1010 304H1042" fill="none" stroke="#e86854" stroke-width="3" marker-end="url(#arrow-coral)"/>
    <path d="M1010 440H1042" fill="none" stroke="#e86854" stroke-width="3" marker-end="url(#arrow-coral)"/>
    <path d="M1010 576H1042" fill="none" stroke="#e86854" stroke-width="3" marker-end="url(#arrow-coral)"/>

    <g transform="translate(64 598)">
      <rect width="536" height="98" rx="20" fill="#143f3a"/>
      <text x="24" y="31" fill="#aee466" font-size="13" font-weight="800" letter-spacing="1.3">STABLE BOUNDARY</text>
      <text x="24" y="61" fill="#ffffff" font-size="21" font-weight="800">game-api</text>
      <text x="132" y="61" fill="#c7ddd7" font-size="15">Plugin • callbacks • models • commands</text>
      <text x="24" y="83" fill="#9fc3bb" font-size="14">The core never imports a concrete plugin class.</text>
    </g>

    <path d="M600 647H650V348H662" fill="none" stroke="#e86854" stroke-width="3" marker-end="url(#arrow-coral)"/>
  </g>
</svg>
